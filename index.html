<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#E2EBFA" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="logo.png">
  <!-- The app name is filled in by js/app.js from js/config.js -->

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/lists.css">
  <link rel="stylesheet" href="css/habits.css">
</head>
<body>
  <div id="app">
    <!-- The four tabs sit side by side on a "track" that slides left and right -->
    <main id="tabs-viewport"><div id="tabs-track"></div></main>
    <nav id="tabbar"></nav>
    <!-- Things that open on top of the tabs -->
    <div id="panels"></div>
    <div id="screens"></div>
    <div id="sheets"></div>
    <div id="toasts"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/dates.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/icons.js"></script>

  <script src="js/items.js"></script>
  <script src="js/itemsheet.js"></script>
  <script src="js/todos.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/search.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/habitsview.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/today.js"></script>
  <script src="js/lists.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
